<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Workback Studio | PARTI Operations</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="assets/parti-favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20260812a"><link rel="stylesheet" href="portal.css?v=20260826c"></head><body>
<div class="portal-shell" data-portal-shell data-theme="light"><header class="portal-header"><p class="portal-header-note">PARTI operations</p><a class="brand-link" href="index.html"><img class="logo-image header-logo-image" src="assets/parti-logo-purple.png" alt="PARTI"></a><button class="theme-toggle" data-theme-toggle type="button">Dark</button></header>
<main class="operations-main"><section class="operations-topbar"><div class="operations-heading"><p class="portal-label">Client operating system</p><h1>Workback studio</h1></div><nav class="operations-nav"><a href="operations-inquiries.html">Inquiries</a><a href="operations-workback.html" aria-current="page">Workbacks</a><a href="operations-roles.html">Roles + packages</a></nav></section><div class="operations-auth"><span data-auth-status>Checking admin access…</span><button class="portal-button portal-button-small" data-operations-logout type="button">Log out</button></div>
<div data-operations-content hidden><section class="planner-layout"><aside class="operations-panel"><h2>Project controls</h2><form class="planner-form" id="workback-form"><label class="form-field"><span>Start from inquiry</span><select id="workback-inquiry"><option value="">Standalone workback</option></select></label><label class="form-field"><span>Project name *</span><input id="workback-name" required maxlength="180"></label><label class="form-field"><span>Event / install date *</span><input id="workback-date" type="date" required></label><label class="form-field"><span>Planning template</span><select id="workback-template"><option value="full">Full experiential project — 12 weeks</option><option value="compressed">Compressed activation — 8 weeks</option><option value="fabrication">Fabrication-led scope — 6 weeks</option></select></label><label class="form-field"><span>Owner</span><input id="workback-owner" maxlength="120" placeholder="Project lead"></label><button class="portal-button portal-button-primary" type="submit">Generate workback</button><button class="portal-button" id="new-workback" type="button">New blank plan</button></form><div style="margin-top:28px"><p class="portal-label">Saved workbacks</p><div id="saved-workbacks"></div></div></aside>
<section class="operations-panel"><div class="detail-header"><div><p class="portal-label" id="timeline-kicker">No active workback</p><h2 id="timeline-title">Choose a project</h2></div><button class="portal-button portal-button-small" id="save-workback" type="button" disabled>Save changes</button></div><p class="form-status" id="workback-status"></p><div class="timeline" id="workback-timeline"><div class="empty-state"><p>Generate or open a workback to map the project lifecycle.</p></div></div></section></section></div></main></div>
